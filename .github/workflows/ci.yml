name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Under workflow_call github.workflow names the caller, so a run called from
# release.yml keys on release-<sha>, never on the caller's own constant group,
# which it would wait on for as long as the caller holds it: a deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Unit tests
        run: npm test

      # Fails only on a hard oracle; a failing soft oracle is a warning
      # annotation.
      - name: Reference oracles
        run: npm run oracles

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Chrome starts with its sandbox. If the runner cannot provide one, set
    # CHROME_NO_SANDBOX: '1' here and in deploy.yml's build job.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Browser smoke and end-to-end tests
        run: npm run test:browser
